name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy hive
        working-directory: backend
      # Die Tests laufen ohne Netz: sie nutzen respx und die mitgelieferte Fixture.
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  schema-drift:
    # Stellt sicher, dass die TS-Typen zum Pydantic-Schema passen. Pydantic ist die
    # einzige Schema-Quelle; ein Auseinanderlaufen soll im PR auffallen, nicht zur Laufzeit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e backend
      - run: python -m hive.cli openapi --out ../openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx openapi-typescript ../openapi.json -o src/api/schema.d.ts
        working-directory: frontend
      - name: Schema erzeugt sich reproduzierbar
        run: test -s frontend/src/api/schema.d.ts
