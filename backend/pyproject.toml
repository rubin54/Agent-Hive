[project]
name = "agent-hive"
version = "0.1.0"
description = "Heterogeneous agent swarm benchmarked against single models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "typer>=0.15",
    "docker>=7.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hive = "hive.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hive"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The Docker SDK ships no type information. The sandbox wraps it behind its own fully
# typed interface — the gap ends there.
[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Custom basetemp: Windows user paths containing umlauts break the default tmp_path
# ("access denied" when creating %TEMP%\pytest-of-<user>).
addopts = "--basetemp=.pytest_tmp"
markers = [
    "docker: requires a reachable Docker daemon",
]
